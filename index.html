<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f9ecf4"/>
<title>정태야 학교가자</title>
<style>

:root{font-family:"Malgun Gothic","Apple SD Gothic Neo",Pretendard,system-ui,sans-serif;color:#503d59;background:#fff7e8;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:radial-gradient(circle at 7% 8%,#ffe4a0 0,#fff8e3 21%,transparent 43%),radial-gradient(circle at 97% 91%,#d9cff9 0,transparent 48%),linear-gradient(140deg,#fffbec 0%,#ffeff9 53%,#ebedff 100%)}
button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #aa7bdf;outline-offset:3px}button:disabled{cursor:default}
#app{max-width:1700px;min-height:100dvh;margin:auto;padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.toolbar{height:42px;display:flex;align-items:center;gap:10px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:1000;white-space:nowrap}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#a480ad;font-weight:900}.brand .symbol{width:42px;height:42px;background:white;border:2px solid #fff;box-shadow:0 5px 16px #b9a0a855;border-radius:14px;display:grid;place-items:center;font-size:22px}
.toolbar-actions{display:flex;gap:7px;margin-left:auto;align-items:center}.ui-btn{border:1px solid #e8cce9;color:#8a6991;background:#fff9fd;box-shadow:0 5px 12px #a6789450;padding:10px 12px;min-height:40px;border-radius:13px;font-weight:950;font-size:12px;white-space:nowrap}.ui-btn:hover{background:#f8e8fb}.ui-btn[aria-pressed="false"]{opacity:.65}
.lobby{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;min-height:0;flex:1}
.slot{min-width:0;min-height:0;border-radius:25px;border:5px solid #fff;background:#fff;box-shadow:0 10px 22px #a689a337;overflow:hidden;position:relative;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease;touch-action:manipulation;padding:0;color:inherit;text-align:left}
.slot:hover{transform:translateY(-3px);box-shadow:0 16px 30px #9978ab4a}.slot:active{transform:scale(.985)}
.slot__art{position:relative;flex:1;min-height:0;display:block;overflow:hidden;background:#c9b5ef}.slot__art img{display:block;width:100%;height:100%;object-fit:cover}.slot__number{position:absolute;top:7px;left:9px;background:#fffaf8e8;border:1px solid #e4d1e5;color:#9b82ab;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:900}
.slot__footer{flex:0 0 35px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;background:#fff9fd;gap:7px}.slot__footer strong{font-size:13px}.slot__footer em{font-style:normal;border:1px solid #eddaf0;background:#f5eafa;border-radius:18px;color:#a38aae;padding:5px 8px;font-size:10px;white-space:nowrap;font-weight:800}
.hero{grid-column:2/span 2;grid-row:2;position:relative;overflow:hidden;background:#ffe9bd;border:5px solid #fff;border-radius:26px;box-shadow:0 10px 22px #a689a337;min-width:0;min-height:0}
.hero>img{width:100%;height:100%;object-fit:cover;display:block}.hero__text{position:absolute;right:3%;top:50%;transform:translateY(-50%);width:36%;text-align:center;pointer-events:none}.hero__text small{font-weight:950;color:#a5788b;font-size:11px;white-space:normal;display:block}.hero__text h1{margin:4px 0;line-height:1.12;font-size:clamp(21px,2.7vw,43px);font-weight:1000;letter-spacing:-2px;color:#b05882;text-shadow:0 2px #fff}.hero__text h1 span{display:block}.hero__text h1 span:last-child{color:#df922b}.hero__text p{display:inline-block;font-weight:900;font-size:11px;background:#fffdf7ed;border-radius:20px;padding:7px 12px;margin:3px 0;color:#a87687}
.footer{height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800;color:#ad8ea8}
#gameView,#resultsView{flex:1;min-height:0;display:none;background:#fff8ff;border:4px solid white;border-radius:26px;box-shadow:0 10px 25px #9d8aab30;padding:14px;overflow:auto}#gameView.active,#resultsView.active{display:flex;flex-direction:column}
.game-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.game-head h2{margin:0;font-size:21px}.game-root{flex:1;min-height:0;position:relative}.results-main{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#modalBackdrop[hidden]{display:none!important}#modalBackdrop{position:fixed;inset:0;z-index:30;background:#2b2047a8;display:grid;place-items:center;padding:max(15px,env(safe-area-inset-top)) max(15px,env(safe-area-inset-right)) max(15px,env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left))}
.modal{width:min(660px,100%);max-height:90dvh;overflow:auto;background:linear-gradient(145deg,#fffdf9,#ffedf9);border:5px solid #fff;border-radius:28px;box-shadow:0 20px 50px #1c132b5c;padding:30px 28px;text-align:center}
.modal h2{font-size:clamp(19px,4.5vw,28px);margin:0 0 16px;color:#875b98}.modal-message{font-size:clamp(15px,3.4vw,19px);font-weight:850;line-height:1.7;white-space:normal;overflow-wrap:anywhere;color:#5e4a6e}.modal-message span{display:block}.modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.modal .ui-btn.primary{background:linear-gradient(120deg,#ffb94e,#ff94a7);color:#fff;border-color:#fff;min-width:130px;font-size:17px}
@media (min-width:860px){#app{height:100dvh}.lobby{height:calc(100dvh - 90px)}}
@media(max-width:850px){#app{height:auto;min-height:100dvh}.toolbar{height:auto;align-items:flex-start;flex-wrap:wrap}.toolbar-actions{flex-wrap:wrap}.lobby{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;gap:10px}.slot{height:clamp(150px,26vw,240px);grid-column:auto!important;grid-row:auto!important}.hero{grid-column:1/span 2!important;grid-row:1!important;height:clamp(180px,33vw,320px)}.hero__text h1{font-size:clamp(23px,5vw,40px)}.footer{height:auto;gap:10px;flex-wrap:wrap}}
@media(max-width:480px){#app{padding:8px;gap:8px}.brand{font-size:12px}.brand .symbol{width:36px;height:36px}.ui-btn{padding:9px 10px;font-size:11px;min-height:40px}.slot{height:clamp(145px,46vw,195px);border-radius:18px;border-width:3px}.slot__footer{padding:6px 8px;flex-basis:33px}.slot__footer strong{font-size:11px}.slot__footer em{font-size:9px}.hero{height:170px;border-width:3px;border-radius:19px}.hero__text{width:39%;right:1.5%}.hero__text small{font-size:7px}.hero__text h1{font-size:24px}.hero__text p{font-size:8px;padding:4px 6px}.modal{padding:22px 16px;border-radius:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


/* v0.1.1: 기존 파스텔 로비 디자인 보존, 공통 런타임 UI 보강 */
[hidden]{display:none!important}
.slot__footer strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui-btn.primary{background:linear-gradient(125deg,#ffbe69,#ff9bb0);border-color:#fff;color:#fff;box-shadow:0 5px 14px #d692a455}
.ui-btn.danger{color:#a3547a;border-color:#f3cedd}
.toolbar-actions{gap:6px}
.game-head{flex-wrap:wrap}.game-head .spacer{margin-left:auto}.game-head .ui-btn{min-height:40px}
.game-root{isolation:isolate;overflow:hidden;border-radius:15px;background:#fff}
#gameView{position:relative}#gameView:focus{outline:none}
#resultsView .results-main{text-align:center}.results-main h2{font-size:clamp(26px,4vw,42px);color:#a35a93;margin:0}.results-main p{font-size:18px;font-weight:800;max-width:720px;overflow-wrap:anywhere;line-height:1.6}
.result-mark{font-size:54px}
.modal-message .record-item{padding:8px 12px;border-radius:12px;background:#fffafc;margin:7px auto;max-width:500px;text-align:left;font-size:14px}
.modal-message .settings-row{display:flex;align-items:center;gap:16px;justify-content:space-between;margin:12px auto;max-width:460px;background:#fffafc;border-radius:14px;padding:12px 14px;font-size:14px}
.modal-message input[type=range]{width:min(52%,240px);accent-color:#a66bb9;cursor:pointer}
.modal-message .settings-value{white-space:nowrap;min-width:36px;font-variant-numeric:tabular-nums}
.modal-message span{display:block}.modal-message .settings-row{display:flex}
.footer span{white-space:nowrap}
#gameView.active{min-height:0}
@media(min-width:860px){.lobby{height:auto}.footer{height:19px}}
@media(max-width:850px){#gameView.active,#resultsView.active{min-height:calc(100dvh - 140px)}.toolbar-actions{margin-left:auto}.hero{order:0}.footer{justify-content:center;text-align:center}}
@media(max-width:480px){.toolbar{gap:8px}.toolbar-actions{gap:4px}.toolbar-actions .ui-btn{font-size:10px;padding:7px 8px;min-height:36px}.game-head h2{width:100%;order:-1;font-size:18px}.game-head .spacer{margin-left:0}#gameView{padding:9px}.game-root{min-height:350px}.slot__art img{object-fit:cover}.modal-message .settings-row{padding:10px 8px;gap:6px}}
@media(max-height:640px) and (min-width:860px){#app{padding-top:6px;padding-bottom:6px;gap:6px}.toolbar{height:38px}.slot__footer{flex-basis:30px;padding:4px 10px}.footer{height:16px}}

/* v0.1.2 — 반응형 로비 / 실제 게임 화면 크기 조절 / 간결한 모바일 상단 바 */
.toolbar{position:relative;z-index:9;min-width:0}
.toolbar-actions{margin-left:auto}
.fullscreen-action{flex:none;border-color:#efbdd3;background:linear-gradient(115deg,#fff8ec,#fff0fc);color:#97618a}
.toolbar-menu-btn{display:none}
.lobby,.game-stage,.game-root{min-width:0}
.slot:focus-visible{outline:4px solid #8f63c4;outline-offset:2px}
.game-stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
 display:flex;justify-content:center;align-items:center;
 background:repeating-linear-gradient(45deg,#f9f1fb,#f9f1fb 12px,#fef9fe 12px,#fef9fe 24px);
 border:1px solid #f1e3f4;border-radius:20px;padding:0}
.game-root{display:block;overflow:hidden;position:relative;flex:none;border-radius:14px;
 background:#fff;box-shadow:0 5px 20px #a08aa325;max-width:100%;max-height:100%}
.game-root:focus{outline:none}
#gameView{overflow:visible;isolation:isolate}
.game-head{min-height:46px;flex:0 0 auto;gap:8px}
.game-head h2{min-width:0;overflow-wrap:anywhere;font-size:clamp(16px,2.2vw,23px);color:#775177}
.game-head .ui-btn{white-space:nowrap}
.game-head #returnBtn{background:#fff8ec}
.game-head #pauseBtn{background:#f6edff}
.game-head #restartBtn{background:#fff6ed}
.orientation-hint{flex:0 0 auto;text-align:center;padding:10px 12px;font-size:13px;
 font-weight:800;color:#916886;background:#fff7d8;border-radius:12px;margin-top:6px}
.touch-controls[hidden]{display:none!important}
.touch-controls{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
 flex-wrap:wrap;gap:10px;padding:10px 4px 3px}
.touch-control{touch-action:none;user-select:none;-webkit-user-select:none;
 font-size:16px;font-weight:950;min-width:64px;min-height:58px;padding:12px 18px;
 border-radius:17px;border:2px solid #ead5ed;box-shadow:0 5px 0 #e0c6e7;
 background:#fff9ff;color:#865c95;transition:transform .12s ease,background .12s ease}
.touch-control:active,.touch-control.pressed{transform:translateY(3px);background:#eddefe;box-shadow:0 2px 0 #d2b0e4}
.modal[data-kind="instructions"]{width:min(740px,100%);text-align:left}
.modal[data-kind="instructions"] h2{text-align:center;margin-bottom:8px}
.modal[data-kind="instructions"] .modal-actions{margin-top:16px}
.instruction-intro{text-align:center;margin:0 0 14px;color:#846985;font-size:14px;font-weight:750}
.instruction-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:9px}
.instruction-steps li{display:flex;align-items:center;gap:12px;background:#fff;
 padding:12px 15px;border-radius:14px;border:1px solid #f0dfef;line-height:1.5;font-size:15px}
.instruction-step{display:grid!important;place-items:center;flex:0 0 34px;width:34px;height:34px;
 color:#9968a1;background:#f5e8fa;border-radius:10px;font-weight:950;font-size:13px}
#modalBackdrop .modal[data-kind="instructions"] .modal-message{max-height:55dvh;overflow:auto}
#resultsView{overflow:auto}
.results-main{min-height:250px}
.results-main .modal-actions .ui-btn{font-size:15px;min-width:155px}
@keyframes screenAppear{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.screen-enter{animation:screenAppear .23s ease-out both}

/* 태블릿 포함: 공간이 제한되면 상단 설정 접기, 전체화면은 우상단 고정 */
@media(max-width:900px){
 .toolbar{flex-wrap:nowrap;gap:7px;min-height:42px}
 .brand{min-width:0;margin-right:auto}
 .toolbar-actions{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:20;
  width:min(340px,calc(100vw - 24px));padding:12px;border:2px solid #f5e9f4;border-radius:18px;
  box-shadow:0 12px 30px #8467804a;background:#fff8fd;
  grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .toolbar-open .toolbar-actions{display:grid}
 .toolbar-actions .ui-btn{font-size:12px;min-height:44px;padding:9px 8px;overflow:hidden;text-overflow:ellipsis}
 .toolbar-menu-btn{display:block;min-width:72px}
 .fullscreen-action{margin-left:0;min-width:92px}
 .game-stage{min-height:clamp(240px,48dvh,660px)}
 .touch-control{min-width:65px;min-height:54px}
}
@media(max-width:700px){
 .brand{font-size:12px;gap:6px}
 .brand small{letter-spacing:1px;font-size:8px}
 .brand .symbol{width:34px;height:34px;font-size:19px}
 .fullscreen-action,.toolbar-menu-btn{min-width:0;padding:8px 10px;min-height:40px;font-size:12px}
 .lobby{column-gap:9px;row-gap:10px}
 .game-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;gap:7px;margin-bottom:8px}
 .game-head h2{grid-column:span 4;order:-1;line-height:1.3;margin:0 2px 3px;font-size:18px}
 .game-head .spacer{display:none}
 .game-head .ui-btn{font-size:11px;padding:10px 4px;min-height:42px;white-space:normal;line-height:1.15}
 #gameView{padding:10px}
 .game-stage{min-height:clamp(225px,47dvh,570px);border-radius:13px}
 .game-root{border-radius:9px}
 .modal{max-height:calc(100dvh - 28px);padding:22px 16px}
 .modal[data-kind="instructions"]{padding:20px 14px}
 .instruction-steps li{padding:10px 9px;font-size:14px;gap:9px}
 .instruction-step{width:30px;height:30px;flex-basis:30px}
 .touch-controls{gap:8px}
 .touch-control{flex:1 1 58px;max-width:110px;min-width:56px;min-height:55px;padding:9px 7px}
 .results-main .modal-actions .ui-btn{min-width:130px}
}
@media(max-width:390px){
 #app{padding-left:max(7px,env(safe-area-inset-left));padding-right:max(7px,env(safe-area-inset-right))}
 .brand small{letter-spacing:.5px}
 .brand{font-size:11px}
 .fullscreen-action,.toolbar-menu-btn{font-size:11px;padding:7px 7px}
 .slot__footer strong{font-size:10px}
 .game-head .ui-btn{font-size:10px}
 .hero{height:170px}
}
@media(orientation:landscape) and (max-height:520px) and (max-width:900px){
 #app{gap:5px}
 .toolbar{min-height:35px}
 .game-head{display:flex;flex-wrap:wrap;gap:5px}
 .game-head h2{width:auto;margin:0;font-size:14px}
 .game-head .ui-btn{min-height:32px;padding:5px 9px}
 #gameView.active{min-height:calc(100dvh - 90px)}
 .game-stage{min-height:190px}
 .touch-control{min-height:39px;max-width:105px;padding:5px 8px}
 .touch-controls{gap:5px;padding:4px}
 .orientation-hint{padding:4px}
}
@media(hover:hover) and (pointer:fine){
 .touch-controls:not([data-show-desktop="true"]){display:none!important}
}
@media(prefers-reduced-motion:reduce){.screen-enter{animation:none!important}}

/* 구버전 모바일 최소 게임 높이가 화면 비율 계산을 덮어쓰지 않도록 조정 */
.game-root{min-height:0!important}
.orientation-hint{display:none}
@media(orientation:portrait){.orientation-hint:not([hidden]){display:block}}


/* v0.1.3 — 기록 관리 및 분리된 볼륨 UI */
.modal[data-kind="records"]{width:min(780px,100%)}
.modal[data-kind="records"] .modal-message{max-height:min(62dvh,630px);overflow:auto;padding:2px 5px;text-align:left}
.record-card{background:#fffafc;border:1px solid #f0dbea;padding:12px 14px;margin:10px 0;border-radius:17px;text-align:left}
.record-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.record-head strong{font-size:16px;color:#835383;overflow-wrap:anywhere}
.record-head .record-delete{flex:none;font-size:11px;min-height:36px;padding:8px 10px}
.record-summary{margin:7px 0;font-weight:650;font-size:12px;color:#846c87}
.record-bests{padding-left:20px;margin:7px 0;font-size:13px;line-height:1.7}
.record-history{font-size:12px;font-weight:600;margin:10px 0;color:#775b76}
.record-history summary{cursor:pointer;font-weight:800;color:#95648f}
.record-history p{margin:7px 5px}
.record-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.record-actions .ui-btn{font-size:12px}
.modal .ui-btn:disabled{opacity:.48;cursor:not-allowed}
.empty-state{margin:15px 0;text-align:center;font-weight:800}
.modal[data-kind="audio-settings"] .modal-message{font-size:14px}
.audio-settings-help{font-weight:550;color:#806d80;font-size:12px;line-height:1.6;margin:12px 10px 0}
@media(max-width:480px){.record-head{align-items:flex-start}.record-head strong{font-size:14px}.record-head .record-delete{font-size:10px;padding:7px 8px}.record-card{padding:10px 9px}}

</style>
</head>
<body>
<div id="app">
  <header class="toolbar"><div class="brand"><span class="symbol" aria-hidden="true">🏫</span><span>학교생활 아케이드<small>CAMPUS MINI GAMES</small></span></div><div class="toolbar-actions" id="toolbarActions">
   <button class="ui-btn" id="recordBtn" type="button">🏆 내 기록</button>
   <button class="ui-btn" id="settingsBtn" type="button">⚙ 음량</button>
   <button class="ui-btn" id="musicBtn" type="button" aria-pressed="true">♫ 음악 ON</button>
   <button class="ui-btn" id="sfxBtn" type="button" aria-pressed="true">◖)) 효과음 ON</button>

<script>
/* 정태야 학교가자 — v0.1.4
 * 단일 앱 공통 런타임. 실제 이관된 미니게임은 현재 0개입니다.
 * 외부 게임은 JTGameHub.registerGame()으로만 등록합니다.
 * 구버전 게임 소스는 이 런타임에 로드되지 않습니다.
 */
(() => {
  'use strict';
  const $ = (selector) => document.querySelector(selector);
  const PLACEMENTS = Object.freeze([
    ['slot-01',1,1], ['slot-02',1,2], ['slot-03',1,3], ['slot-04',1,4],
    ['slot-05',2,1], ['slot-06',2,4],
    ['slot-07',3,1], ['slot-08',3,2], ['slot-09',3,3], ['slot-10',3,4]
  ]);
  const slotIds = new Set(PLACEMENTS.map(([id]) => id));
  const el = Object.freeze({
    app: $('#app'), lobby: $('#lobby'), game: $('#gameView'), gameRoot: $('#gameRoot'),
    results: $('#resultsView'), gameTitle: $('#gameTitle'), resultTitle: $('#resultTitle'),
    resultDetail: $('#resultDetail'), footerCount: $('#footerCount'), bgm: $('#lobbyBgm'),
    backdrop: $('#modalBackdrop'), modalTitle: $('#modalTitle'), modalMessage: $('#modalMessage'),
    modalConfirm: $('#modalConfirm'), modalCancel: $('#modalCancel'),
    musicBtn: $('#musicBtn'), sfxBtn: $('#sfxBtn'), fullscreenBtn: $('#fullscreenBtn'),
    pauseBtn: $('#pauseBtn'), recordBtn: $('#recordBtn'),
    gameStage: $('#gameStage'), touchDock: $('#touchControls'),
    orientationHint: $('#orientationHint'), toolbarMenu: $('#toolbarMenuBtn'),
    toolbarActions: $('#toolbarActions'), modalPanel: $('#modalPanel')
  });
  const safeRead = (key, fallback) => {
    try { const value = JSON.parse(localStorage.getItem(key)); return value ?? fallback; }
    catch (_) { return fallback; }
  };
  const safeWrite = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (_) { return false; }
  };

  /* 영구 gameId / 이동 가능한 slotId / 표시 번호를 분리합니다. */
  class GameRegistry {
    constructor() { this.games = new Map(); this.slots = new Map(); this.numbers = new Map(); }
    register(game) {
      if (!game || typeof game.id !== 'string' || !/^[a-z0-9][a-z0-9._-]{1,79}$/i.test(game.id)
        || !slotIds.has(game.slotId) || typeof game.title !== 'string' || !game.title.trim()
        || typeof game.thumbnail !== 'string' || !game.thumbnail.trim() || typeof game.factory !== 'function'
        || this.games.has(game.id) || this.slots.has(game.slotId)) return false;
      const item = Object.freeze({ ...game, instructions: Array.isArray(game.instructions)
        ? game.instructions.filter(x => typeof x === 'string').slice(0,8) : [] });
      this.games.set(item.id, item);
      this.slots.set(item.slotId, item.id);
      return true;
    }
    byId(id) { return this.games.get(id) || null; }
    bySlot(slotId) { return this.games.get(this.slots.get(slotId)) || null; }
    move(gameId, targetSlotId) {
      const game = this.byId(gameId);
      if (!game || !slotIds.has(targetSlotId)) return false;
      if (game.slotId === targetSlotId) return true;
      if (this.slots.has(targetSlotId)) return false;
      this.slots.delete(game.slotId);
      const changed = Object.freeze({ ...game, slotId: targetSlotId });
      this.games.set(gameId, changed);
      this.slots.set(targetSlotId, gameId);
      return true;
    }
    setDisplayNumber(slotId, number) {
      if (!slotIds.has(slotId) || (number !== null &&
        !(typeof number === 'string' || (Number.isInteger(number) && number >= 0)))) return false;
      if (number === null) this.numbers.delete(slotId);
      else this.numbers.set(slotId, String(number));
      return true;
    }
    displayNumber(slotId) { return this.numbers.get(slotId) ?? slotId.slice(-2); }
    list() { return [...this.games.values()].map(({id, title, slotId}) => ({id, title, slotId})); }
  }
  const registry = new GameRegistry();

  /* 게임별 기록: 기존 v1 저장소 유지, 히스토리/초기화/백업 기능 확장. */
  class RecordStore {
    constructor() {
      const saved = safeRead('jt_school_records_v1', safeRead('jt_reboot_v01_records', {}));
      this.data = saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
      this.historyLimit = 12;
    }
    _entry(gameId) {
      const v = this.data[gameId];
      if (!v || typeof v !== 'object' || Array.isArray(v)) return { attempts:0, best:{}, history:[], clears:0, failures:0 };
      return {
        ...v,
        attempts:Number.isFinite(Number(v.attempts)) ? Math.max(0, Math.floor(Number(v.attempts))) : 0,
        best:v.best && typeof v.best === 'object' && !Array.isArray(v.best) ? {...v.best} : {},
        history:Array.isArray(v.history) ? v.history.slice(0,this.historyLimit) : [],
        clears:Math.max(0,Number(v.clears)||0), failures:Math.max(0,Number(v.failures)||0)
      };
    }
    get(gameId) { return structuredCloneSafe(this._entry(gameId)); }
    save(gameId, result = {}) {
      if (!registry.byId(gameId)) return null;
      const current = this._entry(gameId);
      const supplied = result && typeof result === 'object' ? result : {};
      const metrics = [supplied.metric,...(Array.isArray(supplied.metrics) ? supplied.metrics.slice(0,12) : [])];
      const cleanMetrics=[];
      const now = new Date().toISOString();
      for (const m of metrics) {
        if (!m || typeof m.key !== 'string' || !/^[\w가-힣.-]{1,60}$/u.test(m.key) || !Number.isFinite(m.value)) continue;
        const direction = m.better === 'lower' ? 'lower' : 'higher';
        const mode = String(m.mode ?? 'default').slice(0,50);
        const key = `${m.key}::${mode}`;
        const value = Number(m.value);
        const previous = current.best[key];
        if (!previous || !Number.isFinite(previous.value) || (direction === 'lower' ? value < previous.value : value > previous.value)) {
          current.best[key] = {
            label:String(m.label || m.key).slice(0,80),mode,value,
            unit:String(m.unit || '').slice(0,20),direction,updatedAt:now
          };
        }
        cleanMetrics.push({label:String(m.label || m.key).slice(0,80),mode,value,unit:String(m.unit || '').slice(0,20)});
      }
      const outcome = ['clear','win','fail','lose'].includes(supplied.outcome) ? supplied.outcome : 'completed';
      if (outcome === 'win' || outcome === 'clear') current.clears++;
      if (outcome === 'fail' || outcome === 'lose') current.failures++;
      current.attempts++;
      current.lastPlayedAt=now;
      current.history.unshift({at:now,outcome,message:String(supplied.message||'플레이 완료').slice(0,160),metrics:cleanMetrics});
      current.history=current.history.slice(0,this.historyLimit);
      this.data[gameId]=current;
      safeWrite('jt_school_records_v1',this.data);
      return this.get(gameId);
    }
    resetGame(gameId) {
      if (!registry.byId(gameId)) return false;
      delete this.data[gameId];
      return safeWrite('jt_school_records_v1',this.data);
    }
    resetAll() {
      this.data={};
      return safeWrite('jt_school_records_v1',this.data);
    }
    exportJSON() {
      return JSON.stringify({format:'jt-school-records',version:1,exportedAt:new Date().toISOString(),records:structuredCloneSafe(this.data)},null,2);
    }
  }
  function structuredCloneSafe(v) { try { return JSON.parse(JSON.stringify(v)); } catch (_) { return v; } }
  const records = new RecordStore();

  /* 음악 전환은 순차 페이드아웃→페이드인: BGM 중복 재생 방지. */
  class AudioManager {
    constructor() {
      const persisted=safeRead('jt_school_audio_v1', safeRead('jt_reboot_v01_audio', {}));
      const loaded=persisted && typeof persisted==='object' && !Array.isArray(persisted) ? persisted : {};
      this.settings={music:true,sfx:true,volume:.65,musicVolume:1,sfxVolume:1,...loaded};
      const legacyMusic=safeRead('jt_reboot_music',null);
      const legacySfx=safeRead('jt_reboot_sfx',null);
      if (!localStorageHas('jt_school_audio_v1') && !localStorageHas('jt_reboot_v01_audio')) {
        if (legacyMusic!==null) this.settings.music=!!legacyMusic;
        if (legacySfx!==null) this.settings.sfx=!!legacySfx;
      }
      this.settings.music=this.settings.music!==false;
      this.settings.sfx=this.settings.sfx!==false;
      for (const key of ['volume','musicVolume','sfxVolume']) {
        const n=Number(this.settings[key]);
        this.settings[key]=Number.isFinite(n)?Math.max(0,Math.min(1,n)):(key==='volume'?.65:1);
      }
      this.ctx=null;this.unlocked=false;this.screen='lobby';this.gameTrack=null;
      this.subscribers=new Set();this._playing=null;this._generation=0;
      this._fadeFrame=null;this._fadeCancel=null;this.lastPlaybackError=null;
      this.activeEffects=new Set();
      el.bgm.volume=0;
    }
    get(){return {...this.settings};}
    getStatus(){return {
      screen:this.screen,unlocked:this.unlocked,activeTrack:this._playing===el.bgm?'lobby':this._playing===this.gameTrack?'game':null,
      lobbyPaused:el.bgm.paused,gameTrackPresent:!!this.gameTrack,gameTrackPaused:this.gameTrack?.paused??null,
      masterVolume:this.settings.volume,effectiveMusicVolume:this.settings.volume*this.settings.musicVolume,
      effectiveSfxVolume:this.settings.volume*this.settings.sfxVolume,lastPlaybackError:this.lastPlaybackError
    };}
    update(changes={}){
      for (const key of ['music','sfx']) if(typeof changes[key]==='boolean')this.settings[key]=changes[key];
      for (const key of ['volume','musicVolume','sfxVolume'])
        if(Number.isFinite(changes[key]))this.settings[key]=Math.max(0,Math.min(1,changes[key]));
      safeWrite('jt_school_audio_v1',this.settings);
      this.sync();
      for (const callback of [...this.subscribers]) {
        try{callback(this.get());}catch(err){console.error('게임 오디오 설정 콜백 오류',err);}
      }
    }
    subscribe(callback){this.subscribers.add(callback);return()=>this.subscribers.delete(callback);}
    unlock(){
      this.unlocked=true;
      if(!this.ctx){try {const C=window.AudioContext||window.webkitAudioContext;this.ctx=C?new C():null;}catch(_){this.ctx=null;}}
      if(this.ctx?.state==='suspended')this.ctx.resume().catch(()=>{});
      this.sync();
    }

    isSession(token) { return this.active?.token === token && this.screen === 'game'; }
    show(which) {
      this.screen=which; this.transitions++;
      el.lobby.hidden=which!=='lobby';
      el.game.classList.toggle('active',which==='game');
      el.results.classList.toggle('active',which==='results');
      el.game.hidden=which!=='game';
      el.results.hidden=which!=='results';
      audio.sync(which);
      const activePane=which==='lobby'?el.lobby:which==='game'?el.game:el.results;
      activePane.classList.remove('screen-enter');
      void activePane.offsetWidth;
      activePane.classList.add('screen-enter');
      if (which==='game') requestAnimationFrame(()=>viewport.update());
      if (which==='lobby') setToolbarMenu(false);
    }
    dispose() {
      const old=this.active;
      this.active=null;
      this.session++;
      if (old) {
        touchControls.releaseAll();
        try {
          const result = old.instance?.destroy?.();
          if (result && typeof result.then === 'function')
            Promise.resolve(result).catch(err=>console.error('비동기 게임 정리 오류',err));
        } catch(err){console.error('이전 게임 destroy 오류',err);}
        finally {
          old.scope.dispose();
          this.lastCleanup={gameId:old.game.id,stats:old.scope.stats(),at:new Date().toISOString()};
        }
      }
      audio.stopGameMusic();
      el.gameRoot.replaceChildren();
      touchControls.clear(); setOrientationHint(null);
      viewport.setRatio(null);
      el.pauseBtn.textContent='Ⅱ 일시정지';
    }
    returnLobby() {this.dispose(); this.show('lobby');}
    open(id) {
      const game=registry.byId(id);
      if (!game || modal.visible) return false;
      this.dispose();
      const token=this.session;
      this.lastId=id;
      el.gameTitle.textContent=game.title;
      this.show('game');
      viewport.setRatio(game.aspectRatio);
      setOrientationHint(game);
      const scope=new ResourceScope(
        ()=>this.isSession(token),
        err=>this.fail(err,token),
        ()=>this.isSession(token) && this.active.phase==='running'
      );
      const current={game,instance:null,scope,token,phase:'mounting',hiddenPause:false};
      this.active=current;
      touchControls.configure(game,token);
      scope.pause(); // 게임 준비 과정부터 게임시간 타이머를 멈춰둡니다.
      try {
        const services=this.createServices(game,token,scope);
        const instance=game.factory({container:el.gameRoot,services,scope});
        if (!instance || typeof instance.mount!=='function' || typeof instance.destroy!=='function') {
          throw new Error('게임 factory는 mount/destroy 수명 주기를 제공해야 합니다.');
        }
        current.instance=instance;
        const mounted=instance.mount();
        Promise.resolve(mounted).then(()=>{
          if (!this.isSession(token) || this.active.phase!=='mounting') return;
          current.phase='ready';
          scope.pause(); // 안내 중 시간이 흘러가지 않게 보호
          window.requestAnimationFrame(()=>{
            if (!this.isSession(token) || this.active.phase!=='ready') return;
            if (modal.visible) return this.fail(new Error('게임 안내 팝업 충돌'),token);
            modal.open(`${game.title} · 게임 방법`,game.instructions.length ? game.instructions : ['조작 방법을 확인하고 시작하세요.'],{
              kind:'instructions',confirmText:'게임 시작',cancelText:'로비로',
              onConfirm:()=>this.start(token),
              onCancel:()=>{if(this.isSession(token))this.returnLobby();}
            });
          });
        }).catch(err=>this.fail(err,token));
      } catch(err) {this.fail(err,token);return false;}
      return true;
    }
    start(token) {
      if (!this.isSession(token) || this.active.phase!=='ready') return false;
      const current=this.active;
      current.phase='starting';
      (async()=>{
        await audio.prepareGameStart();
        if(!this.isSession(token) || current.phase!=='starting') return;
        current.scope.resume();
        await current.instance.start?.();
        if (!this.isSession(token) || current.phase!=='starting') return;
        current.phase='running';
        el.gameRoot.focus({preventScroll:true});
        audio.resumeGame();
      })().catch(err=>this.fail(err,token));
      return true;
    }
    createServices(game,token,scope) {
      const alive=()=>this.isSession(token);
      return Object.freeze({
        gameId:game.id,
        resources:scope,
        finish:result=>{if(alive())this.finish(result);},
        returnLobby:()=>{if(alive())this.returnLobby();},
        records:Object.freeze({
          get:()=>records.get(game.id),
          save:result=>alive()?records.save(game.id,result):null
        }),
        audio:Object.freeze({
          getSettings:()=>audio.get(),
          subscribeSettings:callback=>scope.subscribeAudio(callback),
          playMusic:(src,vol,loop)=>{if(alive())audio.playGameMusic(src,vol,loop);},
          stopMusic:()=>{if(alive())audio.stopGameMusic();},
          effect:name=>{if(alive())audio.effect(name);}
        }),
        musicEnabled:()=>audio.get().music,
        sfxEnabled:()=>audio.get().sfx,
        getVolume:()=>audio.get().volume,
        isActive:alive,
        getPhase:()=>alive()?this.active.phase:'disposed',
        viewport:Object.freeze({
          getSize:()=>viewport.getSize(),
          subscribe:fn=>scope.onCleanup(viewport.subscribe(scope.guard(fn)))
        }),
        input:Object.freeze({
          onAction:fn=>scope.addEventListener(el.game,'jt:control',event=>fn(event.detail)),
          releaseAll:()=>{if(alive())touchControls.releaseAll();}
        })
      });
    }
    finish(result={}) {
      const current=this.active;
      if (!current || this.screen!=='game' || !['running','starting'].includes(current.phase) || modal.visible) return false;
      const safeResult=result && typeof result==='object' ? result : {};
      records.save(current.game.id,safeResult);
      const title=current.game.title;
      this.dispose();
      el.resultTitle.textContent=`${title} · 결과`;
      el.resultDetail.textContent=String(safeResult.message||'플레이를 마쳤습니다.');
      this.show('results');
      return true;
    }
    pause(reason='manual') {
      const current=this.active;
      if (!current || current.phase!=='running') return false;
      touchControls.releaseAll();
      current.phase='paused';
      current.hiddenPause=reason==='background';
      current.scope.pause();
      audio.pauseGame();
      try {
        const pending=current.instance.pause?.();
        if (pending && typeof pending.then==='function')
          Promise.resolve(pending).catch(err=>this.fail(err,current.token));
      } catch(err) {this.fail(err,current.token);return false;}
      el.pauseBtn.textContent='▶ 이어하기';
      return true;
    }
    resume() {
      const current=this.active;
      if (!current || current.phase!=='paused') return false;
      current.phase='running'; current.hiddenPause=false;
      try {
        const pending=current.instance.resume?.();
        current.scope.resume();
        if (pending && typeof pending.then==='function')
          Promise.resolve(pending).catch(err=>this.fail(err,current.token));
      } catch(err) {this.fail(err,current.token);return false;}
      audio.resumeGame(); el.pauseBtn.textContent='Ⅱ 일시정지';
      return true;
    }
    restart() {

      const id=this.active.game.id;
      this.returnLobby();
      return this.open(id);
    }
    fail(err,token=null) {
      if (token!==null && !this.isSession(token)) return;
      const error=err instanceof Error?err:new Error(String(err));
      console.error('미니게임 실행 오류:',error);
      this.lastError={name:error.name,message:error.message,at:new Date().toISOString()}; this.errorCount++;

          modal.open('게임 실행 오류',['이 게임을 실행하지 못했습니다.','원본 파일과 필수 리소스를 확인해 주세요.']);
        }
      });
    }
    diagnostics() {
      return Object.freeze({version:'v0.1.4',screen:this.screen,
        activeGameId:this.active?.game.id??null,phase:this.active?.phase??null,
        session:this.session,transitions:this.transitions,resources:this.active?.scope.stats()??null,
        viewport:viewport.getSize(),touchButtons:touchControls.buttons.length,

  /* 게임 기록 관리: 보기, 안전한 개별/전체 삭제 확인, JSON 백업. */
  function showRecords(){
    const games=registry.list();
    modal.open('나의 게임 기록',[],{kind:'records',render:parent=>{
      if(!games.length){
        const empty=document.createElement('p');empty.className='empty-state';
        empty.textContent='아직 연결된 미니게임이 없습니다.';parent.append(empty);return;
      }
      for(const game of games){
        const stats=records.get(game.id);
        const card=document.createElement('section');card.className='record-card';
        const head=document.createElement('div');head.className='record-head';
        const title=document.createElement('strong');title.textContent=game.title;
        const reset=document.createElement('button');reset.type='button';reset.className='ui-btn danger record-delete';
        reset.textContent='이 게임 기록 삭제';reset.disabled=!stats.attempts && !Object.keys(stats.best).length;
        reset.addEventListener('click',()=>{
          modal.close(false);
          modal.open('게임 기록을 삭제할까요?',[`${game.title}의 기록을 삭제합니다.`, '삭제한 기록은 되돌릴 수 없습니다.'],{
            confirmText:'기록 삭제',cancelText:'취소',onConfirm:()=>{records.resetGame(game.id);showRecords();},onCancel:showRecords
          });
        });
        head.append(title,reset);card.append(head);
        const summary=document.createElement('p');summary.className='record-summary';
        summary.textContent=`완료 ${stats.attempts}회 · 성공 ${stats.clears}회 · 실패 ${stats.failures}회`;
        card.append(summary);
        const bests=Object.values(stats.best||{});
        if(bests.length){
          const list=document.createElement('ul');list.className='record-bests';
          for(const item of bests){
            if (!item || !Number.isFinite(item.value))continue;
            const li=document.createElement('li');li.textContent=`${item.label||'기록'}${item.mode&&item.mode!=='default'?` · ${item.mode}`:''}: ${item.value}${item.unit||''}`;
            list.append(li);
          }
          card.append(list);
        } else {
          const note=document.createElement('p');note.className='record-summary';note.textContent='저장된 최고 기록이 없습니다.';card.append(note);
        }
        if(stats.history?.length){
          const recent=document.createElement('details');recent.className='record-history';
          const label=document.createElement('summary');label.textContent=`최근 플레이 기록 (${stats.history.length}개)`;recent.append(label);
          for(const entry of stats.history.slice(0,5)){
            const p=document.createElement('p');
            const date=Number.isFinite(Date.parse(entry.at))?new Date(entry.at).toLocaleString('ko-KR'):'';
            p.textContent=`${date} · ${entry.message||'플레이 완료'}`;recent.append(p);
          }
          card.append(recent);
        }
        parent.append(card);
      }
      const actions=document.createElement('div');actions.className='record-actions';
      const backup=document.createElement('button');backup.className='ui-btn';backup.type='button';backup.textContent='↓ 기록 JSON 백업';
      backup.addEventListener('click',()=>{
        const file=new Blob([records.exportJSON()],{type:'application/json;charset=utf-8'});
        const url=URL.createObjectURL(file);const a=document.createElement('a');
        a.href=url;a.download='정태야학교가자_게임기록.json';document.body.append(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      });
      const clear=document.createElement('button');clear.className='ui-btn danger';clear.type='button';clear.textContent='전체 기록 삭제';
      clear.disabled=!games.some(game=>{const st=records.get(game.id);return st.attempts || Object.keys(st.best).length;});
      clear.addEventListener('click',()=>{
        modal.close(false);
        modal.open('모든 기록을 삭제할까요?',['모든 미니게임의 로컬 기록이 지워집니다.','삭제한 기록은 되돌릴 수 없습니다.'],{
          confirmText:'전체 삭제',cancelText:'취소',onConfirm:()=>{records.resetAll();showRecords();},onCancel:showRecords
        });
      });
      actions.append(backup,clear);parent.append(actions);
    }});
  }
  el.recordBtn.addEventListener('click',showRecords);
  $('#settingsBtn').addEventListener('click',()=>{
    modal.open('소리 설정',['전체·배경음악·효과음 음량을 각각 조절할 수 있습니다.'],{
      kind:'audio-settings',render:parent=>{
        for(const [key,label] of [['volume','전체 음량'],['musicVolume','배경음악'],['sfxVolume','효과음']]){
          const row=document.createElement('label');row.className='settings-row';
          const title=document.createElement('span');title.textContent=label;
          const input=document.createElement('input');input.type='range';input.min='0';input.max='100';input.step='5';
          input.value=String(Math.round(audio.get()[key]*100));input.setAttribute('aria-label',label);
          const value=document.createElement('span');value.className='settings-value';value.textContent=input.value+'%';
          input.addEventListener('input',()=>{value.textContent=input.value+'%';audio.update({[key]:Number(input.value)/100});});
          row.append(title,input,value);parent.append(row);
        }
        const hint=document.createElement('p');hint.className='audio-settings-help';
        hint.textContent='배경음악과 효과음의 ON/OFF는 상단 버튼에서 설정할 수 있습니다. 모든 설정은 이 브라우저에 저장됩니다.';
        parent.append(hint);
      }
    });
  });
  el.musicBtn.addEventListener('click',() => { audio.unlock(); audio.update({music:!audio.get().music}); });
  el.sfxBtn.addEventListener('click',() => { audio.unlock(); audio.update({sfx:!audio.get().sfx}); if(audio.get().sfx) audio.effect('confirm'); });
  $('#returnBtn').addEventListener('click',() => {
    if (!runtime.active) return;
    const wasRunning = runtime.active.phase === 'running';
    if (wasRunning) runtime.pause();
    modal.open('로비로 돌아갈까요?',['현재 게임 진행이 종료됩니다.'],{
      confirmText:'로비로',cancelText:'계속하기',
      onConfirm:() => runtime.returnLobby(),
      onCancel:() => { if(wasRunning) runtime.resume(); }
    });
  });
  $('#gameHelpBtn').addEventListener('click',() => {
    const current = runtime.active; if (!current || modal.visible) return;
    const wasRunning = current.phase === 'running';
    if (wasRunning) runtime.pause();
    modal.open(`${current.game.title} · 게임 방법`,current.game.instructions.length ? current.game.instructions : ['게임을 시작해 보세요.'],{
      kind:'instructions',confirmText:'게임으로',onConfirm:()=> { if(wasRunning) runtime.resume(); },
      onCancel:()=> { if(wasRunning) runtime.resume(); }
    });
  });
  el.pauseBtn.addEventListener('click',() => {
    const current = runtime.active; if (!current || modal.visible) return;
    if (current.phase === 'paused') { runtime.resume(); return; }
    if (!runtime.pause()) return;
    modal.open('일시정지',['게임이 잠시 멈췄습니다.'],{
      confirmText:'계속하기', cancelText:'로비로',
      onConfirm:()=>runtime.resume(), onCancel:()=>runtime.returnLobby()
    });
  });
  $('#restartBtn').addEventListener('click',() => {
    const current = runtime.active; if (!current || modal.visible) return;
    const wasRunning = current.phase === 'running';
    if (wasRunning) runtime.pause();
    modal.open('처음부터 다시 할까요?',['현재 진행 상황을 종료하고 다시 시작합니다.'],{
      confirmText:'다시 시작',cancelText:'취소',
      onConfirm:()=>runtime.restart(), onCancel:()=>{ if(wasRunning) runtime.resume(); }
    });
  });
  $('#resultBackBtn').addEventListener('click',()=>runtime.returnLobby());
  $('#replayBtn').addEventListener('click',()=>{ if (runtime.lastId) runtime.open(runtime.lastId); });

  /* Fullscreen API. 미지원 기기는 정확히 안내합니다. */
  function updateFullscreenButton() {
    const mobile=window.matchMedia('(max-width:700px)').matches;
    el.fullscreenBtn.textContent = document.fullscreenElement ? (mobile?'⛶ 종료':'⛶ 전체화면 종료') : (mobile?'⛶ 최대화':'⛶ 전체화면');
    el.fullscreenBtn.setAttribute('aria-label',document.fullscreenElement?'전체화면 종료':'전체화면 전환');
  }
  el.fullscreenBtn.addEventListener('click',async() => {
    try {
      if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else modal.open('전체화면 안내',['현재 브라우저에서는 전체화면 기능이 제한됩니다.','iPhone/iPad에서는 Safari 공유 메뉴의 ‘홈 화면에 추가’를 이용해 보세요.']);
    } catch (err) {
      modal.open('전체화면 안내',['브라우저에서 전체화면으로 전환하지 못했습니다.','브라우저 설정과 전체화면 지원 여부를 확인해 주세요.']);
    }
  });
  document.addEventListener('fullscreenchange',updateFullscreenButton);
  window.addEventListener('resize',updateFullscreenButton);
  updateFullscreenButton();
  window.addEventListener('pagehide',() => {
    if (runtime.screen==='game') runtime.pause('background');
    touchControls.releaseAll();
    audio.stopEffects();audio.sync();
  });
  window.addEventListener('pageshow',() => {
    if (!document.hidden && runtime.active?.hiddenPause && !modal.visible) {
      modal.open('게임 일시정지',['게임으로 돌아왔습니다. 이어할 준비가 되면 시작해 주세요.'],{
        confirmText:'이어하기',cancelText:'로비로',
        onConfirm:()=>runtime.resume(),onCancel:()=>runtime.returnLobby()
      });
    }
  });
  document.addEventListener('visibilitychange',() => {
    if (document.hidden) {
      if (runtime.screen==='game') runtime.pause('background');
      audio.stopEffects();audio.sync();
    } else {
      audio.sync();
      if (runtime.active?.hiddenPause && !modal.visible) {
        modal.open('게임 일시정지',['다시 플레이할 준비가 되면 이어하기를 누르세요.'],{
          confirmText:'이어하기', cancelText:'로비로',
          onConfirm:()=>runtime.resume(), onCancel:()=>runtime.returnLobby()
        });
      }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !modal.visible && runtime.screen === 'game' && runtime.active?.phase === 'running') {
      e.preventDefault(); el.pauseBtn.click();
    }
  });

  /* 외부 이관 게임 전용 공개 인터페이스. 현재는 어떤 게임도 등록하지 않습니다. */
  // 게임 수와 UI/자산 정합성을 자동 진단합니다. QA 등록 게임도 동일하게 검사합니다.
  function auditReadiness() {
    const issues=[];
    const slots=[...cards.values()];
    const gameList=registry.list();
    const availableIds=new Set(gameList.map(g=>g.id));
    if(slots.length!==10)issues.push('로비 슬롯이 10개가 아닙니다.');
    if(document.querySelectorAll('.hero').length!==1)issues.push('중앙 대표 패널 수가 잘못되었습니다.');
    if(!el.gameRoot||!el.gameStage||!el.results)issues.push('공통 실행 화면이 없습니다.');
    for(const [id] of PLACEMENTS){
      const card=cards.get(id), game=registry.bySlot(id);
      if(!card) {issues.push(`${id} 슬롯이 없습니다.`);continue;}
      if(!game && (card.querySelector('.slot__footer strong')?.textContent!=='COMING SOON'
          || card.querySelector('img')?.alt!=='COMING SOON'))issues.push(`${id} 미개발 표기가 잘못되었습니다.`);
      if(game && !availableIds.has(game.id))issues.push(`${id} 게임 등록 연결이 손상되었습니다.`);
    }
    if(gameList.length>10)issues.push('등록 가능한 게임 수를 초과했습니다.');
    if(typeof audio.update!=='function'||typeof records.save!=='function')issues.push('공통 서비스가 누락되었습니다.');
    return Object.freeze({version:'v0.1.4',ok:issues.length===0,connectedGames:gameList.length,
      comingSoon:10-gameList.length,slots:slots.length,screen:runtime.screen,issues});
  }
  window.JTGameHub = Object.freeze({
    version:'v0.1.4',
    auditReadiness,
    registerGame(info) {
      if (!registry.register(info)) return false;
      renderSlot(info.slotId); renderCount(); return true;
    },
    moveGame(gameId,slotId) {
      if (runtime.screen!=='lobby' || modal.visible) return false;
      const before = registry.byId(gameId)?.slotId;
      if (!registry.move(gameId,slotId)) return false;
      if (before) renderSlot(before);
      renderSlot(slotId); return true;
    },
    setDisplayNumber(slotId,number) {
      if (!registry.setDisplayNumber(slotId,number)) return false;
      renderSlot(slotId); return true;
    },
    openGame:id=>runtime.open(id),
    returnLobby:()=>runtime.returnLobby(),
    finishGame:result=>runtime.finish(result),
    getConnectedGames:()=>registry.list(),
    getSlotLayout:()=>PLACEMENTS.map(([slotId,row,col])=>({slotId,row,col,displayNumber:registry.displayNumber(slotId),gameId:registry.bySlot(slotId)?.id ?? null})),
    getCurrentState:()=>({screen:runtime.screen,activeGameId:runtime.active?.game.id ?? null,phase:runtime.active?.phase ?? null}),
    getRecord:gameId=>records.get(gameId),
    exportRecords:()=>records.exportJSON(),
    getAudioSettings:()=>audio.get(),
    getViewportSize:()=>viewport.getSize(),
    getDiagnostics:()=>runtime.diagnostics()
  });
  // 최초 실행 안내 두 줄 고정: 로비 오른쪽 상단 전체화면 버튼과 연계됩니다.
  modal.open('게임 시작 안내',[
    '우상단의 최대화 버튼을 눌러',
    '전체화면으로 진행하는 것을 추천합니다!'
  ],{onConfirm:()=>audio.unlock()});
  audio.sync();
})();

</script>
